<!DOCTYPE html>
<html lang="ru" data-theme="classic">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Шохрух & Лютфие</title>
    <meta name="theme-color" content="#10141f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============ ТЕМЫ ============
   classic   — русский: тёмно-синий, слоновая кость, золото, розы
   oriental  — крымскотатарский: изумруд, золото, полумесяц, звёзды, голуби
   samarkand — узбекский: лазурь, бирюза, золото, гранат, портал-арка */
      :root,
      [data-theme="oriental"] {
        --deep: #0a2a23;
        --hero-bg: #0f3d33;
        --hero-ink: #f7f0e1;
        --hero-sub: #e8d49c;
        --paper: #f7f0e1;
        --ink: #3a2e1c;
        --cd-bg: #0a2a23;
        --cd-ink: #f7f0e1;
        --cd-sub: #e8d49c;
        --rsvp-bg: #0f3d33;
        --card-bg: #f7f0e1;
        --gold: #c9a24a;
        --gold-soft: #e8d49c;
        --on-gold: #1d1507;
        --env: #12493c;
        --env-front: #0e3a30;
        --env-flap: #17594a;
        --env-line: #c9a24a;
        --seal-bg: radial-gradient(
          circle at 35% 30%,
          #f3dc9a,
          #c9a24a 55%,
          #8b6a22
        );
        --seal-ink: #2b1d05;
        --letter: #f7f0e1;
        --letter-ink: #3a2e1c;
        --letter-shadow: inset 0 0 0 1.4cqw #f7f0e1, inset 0 0 0 1.7cqw #c9a24a;
        --scene-bg: radial-gradient(ellipse at 50% 40%, #0f3d33, #0a2a23 75%);
        --hint: #e8d49c;
        --rays-bg: repeating-conic-gradient(
          rgba(240, 205, 120, 0.4) 0 5deg,
          transparent 5deg 14deg
        );
        --glow: rgba(255, 232, 170, 0.55);
        --spark: #f3dc9a;
        --flash: #fffbee;
        --head: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --head-w: 600;
        --names-it: italic;
        --names-ls: 0;
        --names-size: clamp(46px, 14vw, 70px);
        --r-btn: 999px;
        --r-in: 8px;
        --r-circ: 50%;
        --fact-bg: rgba(255, 255, 255, 0.35);
        --arch-r: 230px 230px 0 0;
        --arch-pad: 56px;
        --hall-r: 999px 999px 6px 6px;
        --hall-ring: 0 0 0 6px var(--paper), 0 0 0 7.5px var(--gold);
        --hall-ph-bg: linear-gradient(160deg, #0f3d33, #0a2a23);
        --hall-ph-ink: #e8d49c;
        --card-ring: 0 0 0 5px var(--rsvp-bg), 0 0 0 6.5px var(--gold);
        --orn: none;
        --orn-size: 64px;
      }
      [data-theme="classic"] {
        --deep: #10141f;
        --hero-bg: #faf6ee;
        --hero-ink: #2a2430;
        --hero-sub: #a8864a;
        --paper: #f1eadb;
        --ink: #2a2430;
        --cd-bg: #1d2538;
        --cd-ink: #f4ecda;
        --cd-sub: #d9c394;
        --rsvp-bg: #faf6ee;
        --card-bg: #fffdf8;
        --gold: #a8864a;
        --gold-soft: #d9c394;
        --on-gold: #1d1507;
        --env: #e4d8bd;
        --env-front: #dacdae;
        --env-flap: #efe5cf;
        --env-line: #a8864a;
        --seal-bg: radial-gradient(
          circle at 35% 30%,
          #b8384a,
          #7d1f2b 60%,
          #4e0f19
        );
        --seal-ink: #f3dc9a;
        --letter: #fffdf8;
        --letter-ink: #2a2430;
        --letter-shadow: inset 0 0 0 1.4cqw #fffdf8, inset 0 0 0 1.7cqw #a8864a;
        --scene-bg: radial-gradient(ellipse at 50% 40%, #2a3350, #10141f 78%);
        --hint: #d9c394;
        --rays-bg: repeating-conic-gradient(
          rgba(230, 195, 120, 0.34) 0 2.5deg,
          transparent 2.5deg 10deg
        );
        --glow: rgba(255, 236, 200, 0.5);
        --spark: #f0d58f;
        --flash: #fffaf0;
        --r-btn: 2px;
        --r-in: 2px;
        --r-circ: 2px;
        --fact-bg: transparent;
        --arch-r: 0;
        --arch-pad: 60px;
        --hall-r: 2px;
        --hall-ring: 0 0 0 5px var(--paper), 0 0 0 6px var(--gold);
        --hall-ph-bg: linear-gradient(160deg, #2a3350, #10141f);
        --hall-ph-ink: #d9c394;
        --card-ring: 0 0 0 5px #fffdf8, 0 0 0 6px var(--gold);
      }
      [data-theme="samarkand"] {
        --deep: #0b1d45;
        --hero-bg: #13306b;
        --hero-ink: #fbf5e9;
        --hero-sub: #86d6de;
        --paper: #fbf5e9;
        --ink: #1d2a4a;
        --cd-bg: #0b1d45;
        --cd-ink: #fbf5e9;
        --cd-sub: #86d6de;
        --rsvp-bg: #13306b;
        --card-bg: #fbf5e9;
        --gold: #d9ae55;
        --gold-soft: #ecd49a;
        --on-gold: #1d1507;
        --turq: #3fb6c2;
        --env: #1a3d82;
        --env-front: #153574;
        --env-flap: #21499a;
        --env-line: #d9ae55;
        --seal-bg: radial-gradient(
          circle at 35% 30%,
          #e0607a,
          #a8263c 58%,
          #6a1222
        );
        --seal-ink: #f6dc9c;
        --letter: #fbf5e9;
        --letter-ink: #1d2a4a;
        --letter-shadow: inset 0 0 0 1.4cqw #fbf5e9, inset 0 0 0 1.7cqw #3fb6c2,
          inset 0 0 0 2.1cqw #fbf5e9, inset 0 0 0 2.35cqw #d9ae55;
        --scene-bg: radial-gradient(ellipse at 50% 40%, #1f4592, #0b1d45 78%);
        --hint: #86d6de;
        --rays-bg: repeating-conic-gradient(
          rgba(236, 200, 110, 0.38) 0 4deg,
          transparent 4deg 9deg,
          rgba(120, 215, 225, 0.32) 9deg 12.5deg,
          transparent 12.5deg 18deg
        );
        --glow: rgba(200, 240, 245, 0.5);
        --spark: #ecd49a;
        --flash: #fbfdff;
        --names-it: normal;
        --names-ls: 0.01em;
        --names-size: clamp(44px, 13vw, 66px);
        --r-btn: 6px;
        --r-in: 6px;
        --r-circ: 50%;
        --fact-bg: rgba(255, 255, 255, 0.45);
        --arch-r: 0;
        --arch-pad: 70px;
        --hall-r: 0;
        --hall-ring: none;
        --hall-ph-bg: linear-gradient(160deg, #1f4592, #0b1d45);
        --hall-ph-ink: #86d6de;
        --card-ring: 0 0 0 5px var(--rsvp-bg), 0 0 0 6.5px var(--gold),
          0 0 0 9px var(--rsvp-bg), 0 0 0 10px var(--turq);
      }
      :root {
        --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      body {
        background: var(--cd-bg);
        color: var(--hero-ink);
        font-family: var(--sans);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      body.locked {
        overflow: hidden;
        height: 100svh;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: none;
        border: 0;
      }
      h1,
      h2,
      h3 {
        font-family: var(--head);
        font-weight: var(--head-w);
      }
      [hidden] {
        display: none !important;
      }

      .orn {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: var(--orn-color, var(--gold));
        opacity: var(--orn-op, 0.14);
        -webkit-mask-image: var(--orn);
        mask-image: var(--orn);
        -webkit-mask-size: var(--orn-size);
        mask-size: var(--orn-size);
      }

      /* ---------- звёзды, блёстки, лучи, искры, розетка ---------- */
      .sky {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        display: none;
      }
      [data-theme="oriental"] .sky,
      [data-theme="classic"] .sky {
        display: block;
      }
      .st {
        position: absolute;
        background: #f3dc9a;
        opacity: 0.2;
        animation: tw 3s ease-in-out infinite;
      }
      .st.s {
        clip-path: polygon(
          50% 0,
          60% 40%,
          100% 50%,
          60% 60%,
          50% 100%,
          40% 60%,
          0 50%,
          40% 40%
        );
      }
      .st.d {
        border-radius: 50%;
        box-shadow: 0 0 6px 1px rgba(243, 220, 154, 0.8);
      }
      [data-theme="classic"] .st.s,
      [data-theme="classic"] .shoot {
        display: none;
      }
      [data-theme="classic"] .st.d {
        background: #f0d58f;
        box-shadow: 0 0 9px 2px rgba(240, 213, 143, 0.75);
      }
      @keyframes tw {
        50% {
          opacity: 1;
          transform: scale(1.5);
        }
      }
      .shoot {
        position: absolute;
        top: 10%;
        left: 78%;
        width: 110px;
        height: 2px;
        background: linear-gradient(90deg, #fff, transparent);
        opacity: 0;
        animation: shoot 8s 2.5s infinite;
      }
      @keyframes shoot {
        0% {
          opacity: 0;
          transform: translate(0, 0) rotate(-28deg);
        }
        3% {
          opacity: 1;
        }
        13% {
          opacity: 0;
          transform: translate(-240px, 130px) rotate(-28deg);
        }
        100% {
          opacity: 0;
        }
      }

      .rays {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 200vmax;
        height: 200vmax;
        margin: -100vmax 0 0 -100vmax;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.2);
        transition: opacity 1.6s ease,
          transform 2.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .rays.on {
        opacity: 1;
        transform: scale(1);
      }
      .rays i {
        position: absolute;
        inset: 0;
        background: var(--rays-bg);
        animation: spin 90s linear infinite;
        -webkit-mask-image: radial-gradient(
          circle,
          #000 0,
          rgba(0, 0, 0, 0.6) 9%,
          transparent 34%
        );
        mask-image: radial-gradient(
          circle,
          #000 0,
          rgba(0, 0, 0, 0.6) 9%,
          transparent 34%
        );
      }
      .rays::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 70vmin;
        height: 70vmin;
        margin: -35vmin;
        border-radius: 50%;
        background: radial-gradient(circle, var(--glow), transparent 68%);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .spark {
        position: absolute;
        left: 50%;
        top: 30%;
        z-index: 10;
        background: var(--spark);
        pointer-events: none;
        clip-path: polygon(
          50% 0,
          60% 40%,
          100% 50%,
          60% 60%,
          50% 100%,
          40% 60%,
          0 50%,
          40% 40%
        );
        animation: spark 1.8s ease-out forwards;
      }
      @keyframes spark {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 1;
        }
        25% {
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
            scale(1) rotate(200deg);
          opacity: 0;
        }
      }
      .mandala {
        display: none;
        position: absolute;
        left: 50%;
        top: 50%;
        width: 160vmin;
        height: 160vmin;
        margin: -80vmin;
        color: var(--gold);
        opacity: 0.15;
        pointer-events: none;
        animation: spin 140s linear infinite;
      }
      .mandala svg {
        width: 100%;
        height: 100%;
      }
      [data-theme="samarkand"] .mandala {
        display: block;
      }

      /* ---------- вспышка и украшения ---------- */
      #flash {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: var(--flash);
        opacity: 0;
        pointer-events: none;
      }
      .bloom {
        position: fixed;
        z-index: 70;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
          circle,
          var(--flash) 0,
          var(--flash) 52%,
          rgba(255, 255, 255, 0) 72%
        );
        transform: scale(0);
        opacity: 0.2;
        transition: transform 1.15s cubic-bezier(0.5, 0, 0.75, 0.35),
          opacity 0.5s ease;
      }
      #fx {
        position: fixed;
        inset: 0;
        z-index: 72;
        pointer-events: none;
        overflow: hidden;
      }
      .dove {
        position: absolute;
        left: 0;
        top: 0;
        width: var(--w);
        opacity: 0;
        animation: fly var(--d) cubic-bezier(0.45, 0.05, 0.55, 0.95) var(--dl)
          forwards;
      }
      .dove svg {
        display: block;
        width: 100%;
        overflow: visible;
        transform: scaleX(var(--flip));
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.28));
      }
      .dove .wing {
        transform-box: fill-box;
        transform-origin: 30% 100%;
        animation: flap 0.32s ease-in-out infinite alternate;
      }
      .dove .wing.back {
        animation-delay: -0.08s;
      }
      @keyframes flap {
        to {
          transform: scaleY(-0.5);
        }
      }
      @keyframes fly {
        0% {
          opacity: 0;
          transform: translate(var(--x0), var(--y0)) rotate(var(--r));
        }
        10% {
          opacity: 1;
        }
        50% {
          transform: translate(var(--xm), var(--ym))
            rotate(calc(var(--r) * 0.4));
        }
        90% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(var(--x1), var(--y1)) rotate(var(--r));
        }
      }
      .fall {
        position: absolute;
        top: -50px;
        left: var(--x);
        width: var(--w);
        animation: fall var(--d) linear var(--dl) forwards;
        opacity: 0;
      }
      .fall i {
        display: block;
        animation: sway var(--s) ease-in-out infinite alternate;
      }
      .fall svg {
        display: block;
        width: 100%;
        overflow: visible;
      }
      @keyframes fall {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        6% {
          opacity: 1;
        }
        88% {
          opacity: 0.95;
        }
        100% {
          transform: translateY(112vh);
          opacity: 0;
        }
      }
      @keyframes sway {
        0% {
          transform: translateX(-22px) rotate(-35deg) rotateY(0);
        }
        100% {
          transform: translateX(22px) rotate(45deg) rotateY(170deg);
        }
      }

      /* ---------- плавающие панели ---------- */
      .bar {
        position: fixed;
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 20, 18, 0.6);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 12px;
        color: #fff;
      }
      .bar-lang {
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
      }
      .bar-lang button {
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 600;
        letter-spacing: 0.06em;
        opacity: 0.7;
      }
      .bar-lang button.on {
        background: #e8d49c;
        color: #1d1507;
        opacity: 1;
      }
      .bar-music {
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        width: 38px;
        height: 38px;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s;
      }
      .bar-music.show {
        opacity: 1;
        pointer-events: auto;
      }
      .bar-music svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #fff;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bar-music .off {
        display: none;
      }
      .bar-music.muted .on {
        display: none;
      }
      .bar-music.muted .off {
        display: block;
      }
      .bar-theme {
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 12px 5px 14px;
        gap: 10px;
        white-space: nowrap;
      }
      .bar-theme small {
        opacity: 0.65;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .bar-theme b {
        font-weight: 600;
        min-width: 86px;
      }
      .bar-theme button {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--c);
        border: 2px solid rgba(255, 255, 255, 0.4);
      }
      .bar-theme button.on {
        border-color: #e8d49c;
        box-shadow: 0 0 0 2px var(--c);
      }

      /* ---------- экран выбора языка ---------- */
      .langscreen {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: radial-gradient(ellipse at 50% 35%, #1b2227, #0b0e10 80%);
        color: #f1ede4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .ls-in {
        width: min(86vw, 340px);
        text-align: center;
        animation: fadeUp 1s ease both;
      }
      .ls-in h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        font-size: 40px;
        line-height: 1.1;
      }
      .ls-sub {
        margin: 10px 0 34px;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #a9a396;
      }
      .ls-in button {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        margin-bottom: 12px;
        padding: 15px 20px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        font-size: 17px;
        font-weight: 500;
        text-align: left;
        transition: 0.25s;
      }
      .ls-in button:hover,
      .ls-in button:focus-visible {
        border-color: #e8d49c;
        background: rgba(232, 212, 156, 0.08);
        outline: none;
      }
      .ls-in button i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
        background: conic-gradient(var(--a) 0 50%, var(--b) 50% 100%);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3);
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* ---------- конверт ---------- */
      .scene {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: var(--scene-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        visibility: hidden;
      }
      .scene.ready {
        visibility: visible;
      }
      .scene > .orn {
        --orn-op: 0.08;
      }
      .env-wrap {
        position: relative;
        width: 100%;
        text-align: center;
        margin-top: 12vh;
      }
      .env-wrap .rays,
      .env-wrap .mandala {
        top: calc(min(86vw, 440px) / 3);
      }
      .envelope {
        position: relative;
        z-index: 1;
        width: min(86vw, 440px);
        aspect-ratio: 3/2;
        margin: 0 auto;
        container-type: inline-size;
        perspective: 1200px;
        filter: drop-shadow(0 22px 28px rgba(0, 0, 0, 0.4));
        cursor: pointer;
        opacity: 0;
      }
      .scene.ready .envelope {
        animation: envIn 1.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.35s both;
      }
      @keyframes envIn {
        from {
          opacity: 0;
          transform: translateY(28px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .env-back {
        position: absolute;
        inset: 0;
        background: var(--env);
        border-radius: 6px;
        overflow: hidden;
        --orn-op: 0.2;
      }
      .env-front {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: var(--env-front);
        border-radius: 6px;
        overflow: hidden;
        --orn-op: 0.18;
        clip-path: polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%);
      }
      .env-front svg,
      .flap svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .flap {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 54%;
        z-index: 4;

      const rnd = (a, b) => a + Math.random() * (b - a)
      const DOVE = `<svg viewBox="0 0 100 70"><path class="wing back" d="M48 42 C50 27 58 14 76 7 C77 18 75 31 67 42 Z" fill="#e6dfcf"/><path d="M10 44 C22 38 38 38 50 42 C60 45 68 44 76 38 C80 35 86 34 89 37 C92 40 90 44 86 45 L95 48 L85 49 C79 55 66 60 52 60 C38 60 28 56 20 50 L3 57 L8 50 L2 46 L12 46 Z" fill="#fff"/><path class="wing" d="M33 45 C29 28 37 11 57 1 C59 7 65 9 70 11 C68 17 70 21 72 25 C66 30 64 38 62 45 Z" fill="#fff" stroke="#e2d8c0" stroke-width=".8"/><path d="M44 40 C46 30 52 22 60 18 M50 42 C52 34 58 27 66 24" stroke="#e2d8c0" stroke-width=".8" fill="none" class="wing"/><circle cx="85" cy="40" r="1.4" fill="#333"/></svg>`
      const PETAL = (c) =>
        `<svg viewBox="0 0 20 26"><path d="M10 0 C18 4 22 14 18 22 C15 27 5 27 2 22 C-2 14 2 4 10 0 Z" fill="${c}"/><path d="M10 4 C9 11 9 17 10 23" stroke="rgba(0,0,0,.14)" stroke-width=".8" fill="none"/></svg>`
      const BODOM = (c) =>
        `<svg viewBox="0 0 24 32"><path d="M13 31 C5 31 1 24 3 16 C5 8 12 2 21 2 C17 5 16 9 18 13 C22 19 22 31 13 31 Z" fill="${c}"/><circle cx="11" cy="22" r="3" fill="rgba(255,255,255,.6)"/></svg>`
      const ROSETTE = (c) =>
        `<svg viewBox="-12 -12 24 24">${petals(

      function spawnFx(kind) {
        const fx = $("#fx"),
          made = []
        if (kind === "doves") {
          const W = innerWidth,
            H = innerHeight
          // flock: [откуда x, y] → [куда x, y], направление
          const routes = []
          for (let i = 0; i < 4; i++)
            routes.push({
              x0: W + rnd(40, 120),
              y0: H * rnd(0.62, 0.95),
              x1: -rnd(140, 220),
              y1: H * rnd(-0.05, 0.25),
              dl: i * rnd(0.35, 0.6),
            }) // справа снизу → влево вверх
          for (let i = 0; i < 3; i++)
            routes.push({
              x0: -rnd(120, 200),
              y0: H * rnd(0.35, 0.6),
              x1: W + rnd(80, 160),
              y1: H * rnd(0.02, 0.22),
              dl: 1.4 + i * rnd(0.4, 0.7),
            }) // слева → вправо вверх
          routes.forEach((r) => {
            const d = document.createElement("div")
            d.className = "dove"
            const flip = r.x1 < r.x0 ? -1 : 1
            const ym = (r.y0 + r.y1) / 2 - H * 0.08
            d.style.cssText =
              `--w:${rnd(58, 92)}px;--d:${rnd(6, 8)}s;--dl:${
                r.dl
              }s;--flip:${flip};--r:${-12 * flip}deg;` +
              `--x0:${r.x0}px;--y0:${r.y0}px;--xm:${
                (r.x0 + r.x1) / 2
              }px;--ym:${ym}px;--x1:${r.x1}px;--y1:${r.y1}px`
            d.innerHTML = DOVE
            fx.appendChild(d)
            made.push(d)
          })
        } else {
          const n = 34
          for (let i = 0; i < n; i++) {
            const f = document.createElement("div")
            f.className = "fall"
            let html, w
            if (kind === "roses") {
              html = PETAL(
                ["#b8243c", "#9e1b32", "#d24a63", "#e7a1ad", "#c7364f"][i % 5]
              )
              w = rnd(13, 24)
            } else {
              const c = ["#d9ae55", "#3fb6c2", "#c2344d", "#ecd49a"][i % 4]
              html = i % 3 ? BODOM(c) : ROSETTE(c)
              w = rnd(14, 24)

              6,

            )}s;--dl:${rnd(0, 3.5)}s;--s:${rnd(1.8, 3.2)}s`
            f.innerHTML = `<i>${html}</i>`

      /* ================= ЯЗЫК ================= */
      let lang = "ru"

      function applyLang(l) {

      /* ================= ВСПЫШКА ================= */
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches
      const flash = $("#flash")

      /* ================= КОНВЕРТ ================= */
      function burst() {
        const env = $("#envelope"),
          made = []
        for (let i = 0; i < 30; i++) {
          const s = document.createElement("span")
          s.className = "spark"
          const size = 7 + Math.random() * 13,

      let opened = false
      function startScrollCue() {

        cue.onclick = () => {

      function openEnvelope() {

        if (reduce) {

        }
        setTimeout(burst, 900)
        // свет расходится от письма и заливает экран
        setTimeout(() => {

      $("#envelope").addEventListener("click", openEnvelope)

      /* ================= МУЗЫКА ================= */
      /* Файлы music-ru.mp3 / music-crh.mp3 / music-uz.mp3 кладутся рядом с index.html. Если файла нет — играет мелодия-заглушка. */
      window.Music = (() => {
        let audio = null,
          ctx = null,
          timer = null,
          drone = [],
          playing = false,
          synth = false
        const HIJAZ = [
          293.66, 311.13, 369.99, 392.0, 440.0, 466.16, 523.25, 587.33,
        ]
        function startSynth() {
          if (synth) return
          synth = true
          const AC = window.AudioContext || window.webkitAudioContext
          if (!AC) return
          ctx = ctx || new AC()
          ctx.resume()
          const out = ctx.createGain()
          out.gain.value = 0.55
          out.connect(ctx.destination)
          const dl = ctx.createDelay(1)
          dl.delayTime.value = 0.38
          const fb = ctx.createGain()
          fb.gain.value = 0.38
          dl.connect(fb)
          fb.connect(dl)
          dl.connect(out)
          drone = [146.83, 220].map((f) => {
            const o = ctx.createOscillator(),
              g = ctx.createGain()
            o.type = "sine"
            o.frequency.value = f
            g.gain.value = 0.035
            o.connect(g)
            g.connect(out)
            o.start()
            return o
          })
          let i = 3
          const note = () => {
            i = Math.max(
              0,
              Math.min(
                7,
                i + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]
              )
            )
            const o = ctx.createOscillator(),
              g = ctx.createGain(),
              n = ctx.currentTime
            o.type = "triangle"
            o.frequency.value = HIJAZ[i]
            g.gain.setValueAtTime(0, n)
            g.gain.linearRampToValueAtTime(0.12, n + 0.015)
            g.gain.exponentialRampToValueAtTime(0.0005, n + 1.8)
            o.connect(g)
            g.connect(out)
            g.connect(dl)
            o.start(n)
            o.stop(n + 1.9)
          }
          note()
          timer = setInterval(note, 620)
        }
        function stopSynth() {
          synth = false
          clearInterval(timer)
          drone.forEach((o) => {
            try {
              o.stop()
            } catch (e) {}
          })
          drone = []
        }
        function setUi() {
          $("#music").classList.toggle("muted", !playing)
        }
        let src = "music.mp3"
        function setSrc(file) {
          if (file === src) return
          src = file
          if (audio) {
            try {
              audio.pause()
            } catch (e) {}
            audio = null
          }
          if (playing) {
            stopSynth()
            start()
          }
        }
        function start() {
          playing = true
          setUi()
          try {
            audio = audio || new Audio(src)
            audio.loop = true
            audio.volume = 0.6
            audio.addEventListener(
              "error",
              () => {
                if (playing) startSynth()
              },
              { once: true }
            )
            const p = audio.play()
            if (p && p.catch)
              p.catch(() => {
                if (playing) startSynth()
              })
          } catch (e) {
            startSynth()
          }
        }
        function stop() {
          playing = false
          setUi()
          try {
            audio && audio.pause()
          } catch (e) {}
          stopSynth()
        }
        return {
          start,
          stop,
          setSrc,
          toggle() {
            playing ? stop() : start()
          },
        }
      })()
      $("#music").addEventListener("click", () => Music.toggle())

      /* ================= ОБРАТНЫЙ ОТСЧЁТ ================= */
      const target = new Date(CONFIG.dateISO).getTime()
      const pad = (n) => String(n).padStart(2, "0")
      function tick() {
        const p = getPhase()
        if (p !== phase) {
          phase = p
          document.documentElement.dataset.phase = p
          applyLang(lang)
        }
        const started = now() >= target

        $("#cdNow").hidden = !(phase === "today" && started)
        $("#cdGrid").hidden = phase === "today" && started
        $("#cdTitle").hidden = phase === "today" && started
        if (phase === "today" && started) {
          $("#cdNow").textContent = t("today_now")
          return
        }
        let s = Math.max(0, Math.floor(Math.abs(target - now()) / 1000))
        let y = 0
        if (phase === "after") {
          y = Math.floor(s / 31556952)
          s -= y * 31556952
        }
        const d = Math.floor(s / 86400)
        s %= 86400
        const h = Math.floor(s / 3600)
        s %= 3600
        const m = Math.floor(s / 60)
        s %= 60
        // после первой годовщины: лет · дней · часов · минут
        const vals =
          y > 0
            ? [
                [y, "u_y"],
                [d, "u_d"],
                [pad(h), "u_h"],
                [pad(m), "u_m"],
              ]
            : [
                [d, "u_d"],
                [pad(h), "u_h"],
                [pad(m), "u_m"],
                [pad(s), "u_s"],
              ]
        ;["d", "h", "m", "s"].forEach((id, i) => {
          $("#cd-" + id).textContent = vals[i][0]
          $("#cd-" + id).nextElementSibling.textContent = t(vals[i][1])
        })
      }

      /* ================= ФОРМА ================= */
      let count = 1
      function renderCompanions() {
        const box = $("#companions")
        const old = [...box.querySelectorAll("input")].map((i) => i.value)
        box.innerHTML = ""
        for (let i = 0; i < count - 1; i++) {
          const inp = document.createElement("input")
          inp.type = "text"
          inp.maxLength = 80
          inp.autocomplete = "off"
          inp.value = old[i] || ""
          inp.placeholder = t("guest_ph").replace("{n}", i + 2)
          box.appendChild(inp)
        }
        $("#companionsBox").hidden = count < 2
        $("#countOut").textContent = count
        $("#minus").disabled = count <= 1
        $("#plus").disabled = count >= CONFIG.maxGuests
      }
      $("#minus").onclick = () => {
        if (count > 1) {
          count--
          renderCompanions()
        }
      }
      $("#plus").onclick = () => {
        if (count < CONFIG.maxGuests) {
          count++
          renderCompanions()
        }
      }
      $$("input[name=att]").forEach((r) =>
        r.addEventListener("change", () => {
          $("#yesBlock").hidden = r.value === "no" && r.checked
        })
      )

      function guestId() {
        let id = null
        try {
          id = localStorage.getItem("guestId")
        } catch (e) {}
        if (!id) {
          id = crypto.randomUUID
            ? crypto.randomUUID()
            : Date.now().toString(36) + Math.random().toString(36).slice(2)
          try {
            localStorage.setItem("guestId", id)
          } catch (e) {}
          window.__gid = window.__gid || id // если хранилище недоступно — хотя бы в пределах визита
          id = window.__gid
        }
        return id
      }
      async function sendRsvp(payload) {
        if (!CONFIG.scriptUrl) {
          await new Promise((r) => setTimeout(r, 700))
          console.log("RSVP (demo):", payload)
          return
        }
        // Apps Script не отдаёт CORS-заголовки, поэтому no-cors: ответ прочитать нельзя, но запись в таблицу происходит.
        await fetch(CONFIG.scriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        })
      }
      $("#demo").hidden = !!CONFIG.scriptUrl

      $("#rsvp").addEventListener("submit", async (e) => {
        e.preventDefault()
        const f = e.target,
          msg = $("#msg"),
          btn = $("#send")
        const name = f.name.value.trim().replace(/\s+/g, " ")
        const att = f.att.value
        msg.textContent = ""
        if (!/\S+\s+\S+/.test(name)) {
          msg.textContent = t("err_name")
          f.name.focus()
          return
        }
        const payload = {
          name,
          attending: att,
          count: att === "yes" ? count : 0,
          companions:
            att === "yes"
              ? [...$$("#companions input")]
                  .map((i) => i.value.trim())
                  .filter(Boolean)
              : [],
          lang,
          id: guestId(),
          hp: f.website.value,
        }
        btn.disabled = true
        btn.textContent = t("sending")
        try {
          await sendRsvp(payload)
          f.hidden = true
          $("#done").hidden = false
          $("#doneText").textContent = t(att === "yes" ? "ok_yes" : "ok_no")
          const done = $("#done")
          done.classList.remove("show")
          void done.offsetWidth
          done.classList.add("show")
          const mark = done.querySelector(".ok-mark")
          mark.replaceWith(mark.cloneNode(true))
          if (att === "yes" && !reduce)
            setTimeout(
              () => spawnFx(THEME_FX[document.documentElement.dataset.theme]),
              700
            )
        } catch (err) {
          msg.textContent = t("err_send")
        } finally {
          btn.disabled = false
          btn.textContent = t("send")
        }
      })
      $("#edit").onclick = () => {
        $("#rsvp").hidden = false
        $("#done").hidden = true
      }

      /* ================= ЗАПУСК ================= */
      const qs = new URLSearchParams(location.search)
      const forcedTheme = PATTERNS[qs.get("theme")] ? qs.get("theme") : null // ?theme=classic|oriental|samarkand — для сравнения

      function chooseLang(l) {
        applyLang(l)
        applyTheme(forcedTheme || LANG_THEME[l])
        flashIn(reduce ? 1 : 420) // короткая белая вспышка…
        setTimeout(
          () => {
            const ls = $("#langscreen")
            if (ls) ls.remove()
            $("#scene").classList.add("ready") // …и из неё медленно проступает конверт
            flashOut(reduce ? 1 : 1500)
          },
          reduce ? 0 : 460
        )
      }
      $$("[data-pick]").forEach((b) =>
        b.addEventListener("click", () => chooseLang(b.dataset.pick))
      )
      $$(".bar-lang button").forEach((b) =>
        b.addEventListener("click", (e) => {
          e.stopPropagation()
          applyLang(b.dataset.lang)
          applyTheme(LANG_THEME[b.dataset.lang])
        })
      )
      $$("[data-theme-btn]").forEach((b) =>
        b.addEventListener("click", () => applyTheme(b.dataset.themeBtn))
      )

      applyLang("ru")
      applyTheme(forcedTheme || "classic")
      tick()
      setInterval(tick, 1000)
      if (qs.has("preview")) $("#themeBar").hidden = false // ?preview — панель сравнения дизайнов
      const preLang = qs.get("lang") // ?lang=uz — ссылка сразу на нужном языке, без экрана выбора
      if (I18N[preLang]) chooseLang(preLang)

      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver(
          (es) =>
            es.forEach((en) => {
              if (en.isIntersecting) {
                en.target.classList.add("in")
                io.unobserve(en.target)
              }
            }),
          { threshold: 0.12 }
        )
        $$(".rv").forEach((el) => io.observe(el))
      } else {
        $$(".rv").forEach((el) => el.classList.add("in"))
      }
    </script>
  </body>
</html>
